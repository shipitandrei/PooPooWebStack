name: Build PS4 package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build OpenOrbis PKG
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Use the official OpenOrbis container directly. This avoids depending on
      # an action repository while keeping the toolchain version reproducible.
      - name: Build and package with OpenOrbis
        run: |
          docker run --rm --user root \
            -w /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc 'export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK; make package'

      - name: Upload installable PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: poo-poo-on-the-toilet-ps4-pkg
          path: IV0000-PPOO00001_00-POOPOOTOILET0001.pkg
          if-no-files-found: error
