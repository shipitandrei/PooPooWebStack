name: Build PS4 package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build OpenOrbis PKG
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The official OpenOrbis action supplies clang, SDL2, create-fself,
      # create-gp4 and PkgTool.Core. Pinning the toolchain keeps output repeatable.
      - name: Build and package with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: make package

      - name: Upload installable PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: poo-poo-on-the-toilet-ps4-pkg
          path: IV0000-PPOO00001_00-POOPOOTOILET0001.pkg
          if-no-files-found: error
