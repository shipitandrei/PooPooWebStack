name: Build Poo Poo PS4 PKG

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Download OpenOrbis v0.5.4 SDK
        id: sdk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -euxo pipefail <<'SCRIPT' > openorbis-sdk.log 2>&1

          SDK_URL=$(gh api repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4 \
            --jq '.assets[] | select(.name == "toolchain-llvm-18.tar.gz") | .browser_download_url')

          test -n "$SDK_URL"

          curl --fail --location --retry 3 \
            "$SDK_URL" \
            --output openorbis-sdk.tar.gz

          rm -rf .openorbis-sdk
          mkdir -p .openorbis-sdk

          tar -xzf openorbis-sdk.tar.gz -C .openorbis-sdk

          LINK_X=$(find "$GITHUB_WORKSPACE/.openorbis-sdk" \
            -type f -name link.x -print -quit)

          test -n "$LINK_X"

          TOOLCHAIN_ROOT=$(dirname "$LINK_X")

          chmod +x "$TOOLCHAIN_ROOT/bin/linux/"*

          test -x "$TOOLCHAIN_ROOT/bin/linux/PkgTool.Core"
          test -x "$TOOLCHAIN_ROOT/bin/linux/create-fself"
          test -x "$TOOLCHAIN_ROOT/bin/linux/create-gp4"

          echo "TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

          SCRIPT

      - name: Upload SDK diagnostics
        if: steps.sdk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-sdk-diagnostics
          path: openorbis-sdk.log
          if-no-files-found: error

      - name: Stop after SDK failure
        if: steps.sdk.outcome == 'failure'
        run: |
          cat openorbis-sdk.log
          exit 1

      - name: Compile with LLVM 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18

          export OO_PS4_TOOLCHAIN="$TOOLCHAIN_ROOT"

          if ! make \
            CCX=clang++-18 \
            LD=ld.lld-18 \
            pkg/eboot.bin > poopoobuild-compile.log 2>&1; then
            cat poopoobuild-compile.log
            exit 1
          fi

          cat poopoobuild-compile.log

          test -s pkg/eboot.bin

      - name: Package PKG with OpenOrbis tools
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"

          if ! docker run --rm --user 0:0 \
            --env OO_PS4_TOOLCHAIN=/opt/openorbis \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$TOOLCHAIN_ROOT:/opt/openorbis" \
            --workdir /work \
            ubuntu:20.04 \
            bash -lc '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq

              apt-get install -y --no-install-recommends \
                make \
                libicu66 \
                libssl1.1 \
                ca-certificates \
                python3

              make IV0000-PPOO00001_00-POOPOOTOILET0001.pkg
            ' > poopoobuild-package.log 2>&1; then

            cat poopoobuild-package.log
            exit 1
          fi

          cat poopoobuild-package.log

          test -s IV0000-PPOO00001_00-POOPOOTOILET0001.pkg

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poopoogame-build-diagnostics
          path: |
            openorbis-sdk.log
            poopoobuild-compile.log
            poopoobuild-package.log
          if-no-files-found: ignore

      - name: Upload PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: PooPooOnTheToilet-PS4
          path: IV0000-PPOO00001_00-POOPOOTOILET0001.pkg
          if-no-files-found: error
