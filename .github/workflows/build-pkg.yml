name: Build Poo Poo PS4 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS4 PKG
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenOrbis
        run: |
          docker run --rm \
            -w /workspace \
            -v "$PWD:/workspace" \
            openorbisofficial/toolchain:v0.5.4 \
            make package

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PooPooOnTheToilet-PS4
          path: "*.pkg"
          if-no-files-found: error
