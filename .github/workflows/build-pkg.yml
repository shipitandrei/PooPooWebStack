name: Build Poo Poo PS4 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS4 PKG
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: make package

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PooPooOnTheToilet-PS4
          path: |
            *.pkg
            **/*.pkg
          if-no-files-found: error
