<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 Fullscreen Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

#screen {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#status {
    font-size: 48px;
    font-weight: bold;
}

#details {
    margin-top: 25px;
    font-size: 26px;
    color: #aaa;
}
</style>
</head>

<body>

<div id="screen">
    <div id="status">TESTING AUTOMATIC FULLSCREEN...</div>
    <div id="details"></div>
</div>

<script>
var status = document.getElementById("status");
var details = document.getElementById("details");

function updateInfo() {
    details.innerHTML =
        "Viewport: " +
        window.innerWidth + " × " +
        window.innerHeight +
        "<br><br>" +
        "Fullscreen API: " +
        (document.documentElement.requestFullscreen ||
         document.documentElement.webkitRequestFullscreen
            ? "AVAILABLE"
            : "NOT AVAILABLE");
}

function tryFullscreen() {
    var element = document.documentElement;

    try {
        if (element.requestFullscreen) {
            var result = element.requestFullscreen();

            if (result && result.catch) {
                result.catch(function(error) {
                    status.innerHTML = "AUTOMATIC FULLSCREEN FAILED";
                    details.innerHTML +=
                        "<br><br>Error: " + error;
                });
            }

        } else if (element.webkitRequestFullscreen) {
            element.webkitRequestFullscreen();

        } else {
            status.innerHTML = "FULLSCREEN API NOT AVAILABLE";
        }

    } catch (error) {
        status.innerHTML = "AUTOMATIC FULLSCREEN FAILED";
        details.innerHTML +=
            "<br><br>Error: " + error;
    }
}

function checkFullscreen() {
    updateInfo();

    var width = window.innerWidth;
    var height = window.innerHeight;

    if (width >= 1700 && height >= 900) {
        status.innerHTML = "🎉 FULLSCREEN WORKS!";
    }
}

window.addEventListener("resize", checkFullscreen);

updateInfo();

/*
 * Attempt immediately.
 */
tryFullscreen();

/*
 * Try again after a short delay in case the
 * browser isn't ready immediately.
 */
setTimeout(tryFullscreen, 1000);

</script>

</body>
</html>
